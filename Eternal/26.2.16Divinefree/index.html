<!-- 星星容器 -->
<div id="stars" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:500;"></div>

<!-- 粒子容器 -->
<div id="particles" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:500;"></div>


<script>

const playButton = document.getElementById('playButton');
const loveButton = document.getElementById('loveNavigationButton');
const audio = document.getElementById('myAudio');
const miniPopup = document.getElementById('miniPopup');
const starsContainer = document.getElementById('stars');
const particlesContainer = document.getElementById('particles');

let hidePopupTimeout1 = null;
let hidePopupTimeout2 = null;

// 生成星星和粒子动画
function generateStars() {
  starsContainer.innerHTML = '';
  for(let i=0; i<100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.width = star.style.height = size + 'px';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDelay = (Math.random() * 2) + 's';
    starsContainer.appendChild(star);
  }
}

function generateParticles() {
  particlesContainer.innerHTML = '';

  const particleCount = 120; // 粒子数量（越多越细腻）
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;
  const scale = 12; // 控制心形大小

  for (let i = 0; i < particleCount; i++) {

    const t = Math.PI * 2 * (i / particleCount);

    // 心形公式
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y =
      13 * Math.cos(t) -
      5 * Math.cos(2 * t) -
      2 * Math.cos(3 * t) -
      Math.cos(4 * t);

    const p = document.createElement('div');
    p.className = 'p';

    const size = Math.random() * 6 + 4;
    p.style.width = p.style.height = size + 'px';

    // 居中 + 缩放
    p.style.left = centerX + x * scale + 'px';
    p.style.top = centerY - y * scale + 'px';

    p.style.animationDuration = (Math.random() * 10 + 10) + 's';

    particlesContainer.appendChild(p);
  }
}


// playButton 点击播放音频，只控制音乐，按钮保持不变，不渐隐
playButton.addEventListener('click', () => {
  audio.muted = false;
  audio.play().catch(err => {
    console.log("播放失败，原因:", err);
  });

  // 清除弹窗渐隐定时器，避免冲突
  if (hidePopupTimeout1) clearTimeout(hidePopupTimeout1);
  if (hidePopupTimeout2) clearTimeout(hidePopupTimeout2);

  // 弹窗立即渐隐并隐藏（和之前一样）
  miniPopup.style.opacity = '0';
  setTimeout(() => {
    miniPopup.style.display = 'none';
  }, 1500);

  playButton.classList.add('click-effect');
});

playButton.addEventListener('animationend', () => {
  playButton.classList.remove('click-effect');
});

window.addEventListener('load', () => {
  generateStars();
  generateParticles();
}); 


// loveButton 点击显示弹窗，5秒后开始渐隐，并在渐隐完成后跳转
loveButton.addEventListener('click', () => {
  // 清除之前的定时器
  if (hidePopupTimeout1) clearTimeout(hidePopupTimeout1);

  // 显示弹窗，并从透明开始
  miniPopup.style.display = 'block';
  miniPopup.style.opacity = '0';  // 确保从透明开始
  void miniPopup.offsetWidth;     // 强制重绘，确保过渡生效
  miniPopup.style.opacity = '1';  // 变为不透明

  loveButton.classList.add('click-effect');

  // 5秒后开始渐隐
  hidePopupTimeout1 = setTimeout(() => {
    miniPopup.style.opacity = '0';
  }, 5000);
});

loveButton.addEventListener('animationend', () => {
  loveButton.classList.remove('click-effect');
});

// 弹窗透明度渐变结束监听
miniPopup.addEventListener('transitionend', (e) => {
  if (e.propertyName === 'opacity' && miniPopup.style.opacity === '0') {
    miniPopup.style.display = 'none';

    console.log('弹窗已隐藏');

    // ✅ 渐隐完成后跳转页面
    window.location.href = 'https://www.120525.world/Eternal/26.2.16Divinefree/';  // <-- 这里改成你想跳转的地址 
  }
});

</script>
