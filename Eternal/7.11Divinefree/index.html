
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>共频 • 心灵成长</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height:100vh;
      overflow:hidden;
      font-family:'Cinzel', serif;
      color: #fff;
      background: linear-gradient(135deg, #2b5876, #4e4376, #e0c3fc);
      background-size: 300% 300%;
      animation: bgMove 20s ease infinite;
      position: relative;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .stars, .particles {
      position:absolute; top:0; left:0;
      width:100%; height:100%;
      pointer-events:none;
    }

    .stars .star {
      position:absolute;
      background:#fff;
      border-radius:50%;
      opacity:0;
      animation: starTwinkle 2s infinite ease-in-out;
    }
    @keyframes starTwinkle {
      0%,100% { opacity:0; }
      50% { opacity:0.8; }
    }

    .particles .p {
      position:absolute;
      width:4px; height:4px;
      background:rgba(255,255,255,0.2);
      border-radius:50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      to { transform: translateY(-120vh) scale(1.5); opacity:0; }
    }

    .glow {
      position:absolute;
      width:200px; height:200px;
      background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
      filter: blur(60px);
      animation: glowMove 25s ease-in-out infinite alternate;
    }
    @keyframes glowMove {
      0% { transform: translate(var(--dx), var(--dy)) scale(1); }
      100% { transform: translate(calc(var(--dx)*-1), calc(var(--dy)*-1)) scale(1.3); }
    }

    .content {
      position: relative;
      z-index:1;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:2rem;
    }

               h1 {
            font-size: 4em;
            margin-bottom: 1rem;
            color: #f8f8f8;
            text-shadow: 0px 0px 10px rgba(255,255,255,0.8), 0px 0px 20px rgba(255,255,255,0.6);
            animation: float 6s ease-in-out infinite; /* 浮动时间增加为 6s */
            font-family: 'Dancing Script', cursive; /* 使用浪漫的手写字体 */
        
           transform: translateY(30vh); /* 使用 vh 让元素向下移动，15vh 可根据需要调整 */ 
        }

   p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6em;
            line-height: 1.8;
            margin-bottom: 1rem;
            max-width: 80%;
            color: #f8f8f8;
            text-shadow: 0px 0px 10px rgba(255,255,255,0.7), 0px 0px 20px rgba(255,255,255,0.5);
            animation: fadeIn 12s ease-in-out infinite; /* 渐显效果的停留时间增加到 12s */
          
        }

             /* 优化后的按钮样式 */
.button {
    background: linear-gradient(45deg, #f39c12, #f1c40f); /* 黄色渐变 */
    color: white;
    border: none;
    padding: 12px 0; /* 修改按钮内边距为上下 12px */
    font-size: 1.2em;  /* 字体大小 */
    font-family: 'Cinzel', serif;
    border-radius: 25px; /* 增大圆角 */
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* 增强阴影 */
    position: fixed; /* 使用 fixed 确保按钮不随页面滚动 */
    width: 200px; /* 设置固定宽度 */
    left: 67%; /* 保持水平居中 */

    bottom: 130px; /* 设置 Soul mate 按钮的位置（在上面） */
    display: block; /* 确保按钮显示 */
    z-index: 1000; /* 确保按钮显示在所有内容之上 */
    transition: transform 0.2s ease, box-shadow 0.3s ease, background-color 0.3s ease;
}

/* #loveNavigationButton 的样式 */
#loveNavigationButton {
    background: linear-gradient(45deg, #e74c3c, #c0392b);  /* 更改为红色渐变 */
    color: white;
    border: none;
    padding: 12px 0; /* 增大按钮的内边距 */
    font-size: 1.2em;  /* 字体大小 */
    font-family: 'Cinzel', serif;
    border-radius: 25px; /* 增大圆角 */
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* 增强阴影 */
    position: fixed; /* 使用 fixed 确保按钮不随页面滚动 */
    width: 200px; /* 设置固定宽度 */
    left: 67%; /* 保持水平居中 */
 
    bottom: 65px; /* 设置 爱的导航按钮的位置（在下面） */
    display: block; /* 确保按钮显示 */
    z-index: 1000; /* 确保按钮显示在所有内容之上 */
    transition: transform 0.2s ease, box-shadow 0.3s ease, background-color 0.3s ease;
}
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="particles" id="particles"></div>
  <div class="glow" style="--dx:15vw;--dy:20vh;"></div>
  <div class="glow" style="--dx:-20vw;--dy:-15vh;"></div>

  <div class="content">
    <div>

    <h1> 自由意识 共频成长 </h1> 

    <!-- Soul mate 按钮 -->
    <button id="playButton" class="button">Divine free</button> 

    <p class="move-down"> 
    谢谢你的爱和疗愈 唤醒我的自由意识主权 <br>


    喜欢 我们的相处 不是因为期待 角色 或 要求 <br> 
    
    而是 因为 每个瞬间的 自愿 <br> 

    不是为了 回应 而是基于 每份表达的 自由 <br>    
</p>
<!-- 爱的导航按钮 -->
<button id="loveNavigationButton">Back to free</button>
  </div>

  <!-- 爱的导航按钮 -->
<button id="loveNavigationButton">Back to free</button>

    <!-- 音乐播放器控制 -->
<div class="music-player">
    <audio id="myAudio" preload="auto" muted>
        <source src="MP3/Heartflow.flac" type="audio/flac">
        您的浏览器不支持音频播放。
    </audio>
</div>

  <script>

// 爱的导航按钮的点击事件
document.getElementById('loveNavigationButton').addEventListener('click', function() {
    // 跳转到其他 URL
    window.location.href = 'https:///';  // 替换成你想跳转的 URL
});


    document.getElementById('playButton').addEventListener('click', function() {
        var audio = document.getElementById('myAudio');
        
        // 这里删除了跳转到第1秒的代码，音频会从头开始播放
        // 解除静音并播放音频
        audio.muted = false; 
        audio.play().then(function() {
            console.log("音乐正在播放");
        }).catch(function(error) {
            console.log("播放失败，原因:", error);
        });
    });



    const s = document.getElementById('stars');
    for(let i=0;i<100;i++){
      const d = document.createElement('div');
      d.className = 'star';
      const x = Math.random()*100, y=Math.random()*100;
      const size = Math.random()*2+1;
      d.style.width = d.style.height = size+'px';
      d.style.top = y+'%'; d.style.left = x+'%';
      d.style.animationDelay = Math.random()*2+'s';
      s.appendChild(d);
    }
    const pWrap = document.getElementById('particles');
    for(let i=0;i<30;i++){
      const p = document.createElement('div');
      p.className = 'p';
      p.style.left = Math.random()*100+'%';
      p.style.top = Math.random()*100+'%';
      p.style.animationDuration = Math.random()*15+10+'s';
      pWrap.appendChild(p);
    }
  </script>
</body>
</html>
