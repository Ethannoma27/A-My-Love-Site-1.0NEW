<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unconditional Love</title>
  
  <style>
    /* ====== 导入字体 ====== */
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script&family=Noto+Serif+SC&display=swap');

    /* ====== 重置和基础样式 ====== */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body, html {
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Serif SC', serif;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: #f8f0e3;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* ====== 星空效果 ====== */
    .stars {
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0; left: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation-name: twinkle;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    /* ====== 主内容容器 ====== */
    main {
      position: relative;
      z-index: 10;
      padding: 2.5rem 3rem;
      border-radius: 20px;
      max-width: 650px;
      text-align: center;
      user-select: none;
      overflow: hidden; /* 限制背景模糊层不溢出 */
    }

    /* 背景模糊层 */
      .rose-bg-blur {
  position: absolute;
  inset: 0;
  background: url('images/flower.jpg') center center / cover no-repeat;
  filter: blur(3px);
  opacity: 0.5;
  z-index: 1;
  pointer-events: none;
  border-radius: 20px;
  width: 100% !important;
  height: 100% !important;
  min-width: 200px !important;
  min-height: 200px !important;
  border: none;
  background-color: transparent;
}

    /* 给文字容器固定宽度，且居中对齐 */
  #textDisplay {
  font-size: 1.6rem;
  font-style: italic;
  color: #ff9db8;
  text-shadow: 0 0 8px #ff70a6;
  max-width: 600px;      /* 固定最大宽度，防止抖动 */
  min-height: 2.2em;     /* 保持高度一致，避免高度抖动 */
  margin: 0 auto;
  overflow-wrap: break-word;
  opacity: 1;
  transition: opacity 1s ease;  /* 渐隐渐现动画 */
  user-select: none;

  /* 新增的间距 */
  margin-top: 1rem;    /* 让文字稍微往下离开标题 */
  padding-left: 1rem;  /* 左侧内边距，增加和左边元素的距离 */

}
    /* ====== 文字样式 ====== */
    h1 {
      position: relative;
      z-index: 2;
      font-family: 'Dancing Script', cursive;
      font-size: 4rem;
      color: #ff70a6;
      text-shadow:
        0 0 8px #ff70a6,
        0 0 20px #ff477e,
        0 0 30px #ff266e;
      animation: floatBreathe 6s ease-in-out infinite;
    }
    h2 {
      position: relative;
      z-index: 2;
      font-family: 'Noto Serif SC', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: #f4c2c2;
      margin-bottom: 2.5rem;
      text-shadow: 0 0 5px #ffa3b1;
    }
    p {
      position: relative;
      z-index: 2;
      font-size: 1.4rem;
      line-height: 2;
      margin-bottom: 1.4rem;
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeInUp 2s forwards;
      text-shadow:
        0 0 10px #ff4f7c80,
        0 0 20px #ff5c9275;
    }

    .date {
      position: relative;
      z-index: 2;
      margin-top: 25rem;  
      margin-left: -5rem;   
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffadc6;
      text-shadow: 0 0 10px #ff7aa9;
    }

    /* ====== 动画定义 ====== */
    @keyframes floatBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
/* 音乐播放器 - 上面 */
.music-player {
  position: fixed;
  right: 150px; /* 往左移动了50px */
  bottom: 135px;
  z-index: 20;
}

/* 播放按钮样式 */
#playButton {
  background: transparent;
  border: 2px solid #ff70a6;
  color: #ff70a6;
  width: 150px;
  height: 50px;
  font-size: 1rem;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 0 10px #ff70a6;
  transition: all 0.3s ease;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
#playButton:hover {
  background: #ff70a6;
  color: white;
  box-shadow: 0 0 25px #ff70a6;
}

/* 爱的导航按钮 - 下面 */
#loveNavigationButton {
  position: fixed;
  right: 150px; /* 同样往左移动了50px */
  bottom: 70px;
  background: transparent;
  border: 2px solid #ff70a6;
  color: #ff70a6;
  width: 150px;
  height: 50px;
  font-size: 1rem;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 0 10px #ff70a6;
  transition: all 0.3s ease;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
#loveNavigationButton:hover {
  background: #ff70a6;
  color: white;
  box-shadow: 0 0 25px #ff70a6;
}

@media (max-width: 480px) {
  main {
    padding: 1.8rem 2rem;
    background-color: rgba(0, 0, 0, 0.2); /* 保持轻微暗背景 */
  }

  h1 {
    font-size: 3rem;
    font-family: "PingFang SC", "Heiti SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em; /* 微调字距，让视觉更舒展 */
  }

  h2 {
    font-size: 1.2rem;
    margin-bottom: 1.8rem;
  }

  p {
    font-size: 1.2rem;
    margin-bottom: 1rem;
  }

  .rose-bg-blur {
    background-image: url('images/flower_mobile.jpg'); /* 手机专用图 */
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0.75;       /* 提高透明度，图片更清晰 */
    filter: blur(3px);   /* 降低模糊值，更柔和 */
  }
}


  </style>
</head>
<body>

  <!-- 星空层 -->
  <div class="stars"></div>

  <!-- 背景模糊层 -->
  <div class="rose-bg-blur"></div>

  <!-- 主内容 -->
   <h1>我爱你</h1>
  <div class="text-fade" id="textDisplay"></div>
  <div class="date">2025年7月31日</div>

  </main>

  <!-- 音乐播放器 -->
  <div class="music-player">
    <button id="playButton" aria-label="播放浪漫音乐">Divinelove ♫</button>
    <audio id="myAudio" preload="auto" loop>
      <source src="MP3/Divinelove.mp3" type="audio/mp3" />
      您的浏览器不支持音频播放。
    </audio>
  </div>

  <!-- 爱的导航按钮 -->
  <button id="loveNavigationButton" title="回到爱">Back to love</button>
  <script> 

const texts = [
  "I Love u", 
  "不是为了感动谁", 
  "而是为了我自己",
  "我不想 错过你",
  "记得吗 2012.8.9",
  "我约你见面",
  "我说我们一定要见面", 
  "万一留不下这个城市 怎么办",
  "我真的 不想错过你",
  "后面我又回来也好",
  "有些是因为天意",
  "有些是我们相互的坚持",
  "如果爱你不需要条件",
  "如果可以简单的与你相守",
  "我不想问多久以后会怎样",
  "像你说的，珍惜每一个此刻",
  "不是为了别人 ", 
  "也不是强求结果", 
  "是我喜欢 遵从我内心的意愿",
  "我内心 从不想错过你", 
  "我也没有心情 爱别的人", 
   "爱你不需要 回报和承诺", 
  "就算只有不确定的机会", 
  "我也 不愿意放弃",
  "因为 最真实的我 ",
  "热爱这样的 意愿 ", 
  "我确实有一段时间 很无力 ", 
  "找不到 方向和动力 ", 
  "我很感激 你让我唤醒自己 ", 
  "那个有能力爱你的 我 ",   
  "就是我想成为的样子 ",   
  "不管未来是怎样的 ",   
  "还记得2012年暴风雨天", 
  "和你去K歌 ",   
  "还记得在广州番禺的花海中", 
  "背着你 像个孩子似的",   
   "那些无拘无束爱你的日子 ", 
   "真好 ",   
   "你让我怎么能不 爱你 "    
];
const display = document.getElementById('textDisplay');
let index = 0;

// 创建一个隐藏元素，用于测量文本宽度
const measurer = document.createElement('span');
measurer.style.visibility = 'hidden';
measurer.style.whiteSpace = 'nowrap';
measurer.style.position = 'absolute';
measurer.style.fontSize = getComputedStyle(display).fontSize;
measurer.style.fontFamily = getComputedStyle(display).fontFamily;
document.body.appendChild(measurer);

// 计算最长文本宽度，设置容器宽度固定
let maxWidth = 0;
texts.forEach(text => {
  measurer.textContent = text;
  const width = measurer.getBoundingClientRect().width;
  if (width > maxWidth) maxWidth = width;
});
display.style.width = Math.ceil(maxWidth) + 'px';

measurer.remove();

function showNextText() {
  display.style.opacity = 0; // 渐隐

  setTimeout(() => {
    display.textContent = texts[index];
    display.style.opacity = 1; // 渐显
    index = (index + 1) % texts.length;
  }, 1000);
}

showNextText();
setInterval(showNextText, 5000); 

    // ====== 生成星星 ======
    const starsContainer = document.querySelector('.stars');
    const numberOfStars = 150;
    for(let i = 0; i < numberOfStars; i++){
      const star = document.createElement('span');
      star.classList.add('star');
      const size = Math.random() * 2 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.top = `${Math.random() * 100}vh`;
      star.style.left = `${Math.random() * 100}vw`;
      star.style.animationDuration = `${Math.random() * 3 + 2}s`;
      star.style.animationDelay = `${Math.random() * 5}s`;
      starsContainer.appendChild(star);
    }
// ====== 音乐播放控制 ======
const playButton = document.getElementById('playButton');
const audio = document.getElementById('myAudio');

playButton.addEventListener('click', () => {
  if (audio.paused) {
    audio.currentTime = 21; // 从21秒开始播放
    audio.play().then(() => {
      playButton.textContent = 'Divinelove ♫';
    }).catch(() => {
      alert('自动播放被浏览器限制，请点击允许播放');
    });
  }
});
    // ====== 爱的导航按钮跳转 ======
    document.getElementById('loveNavigationButton').addEventListener('click', () => {
      window.location.href = 'https://www.120525.world/Eternal/7.31Divinelove/'; // 替换为你的链接
    });
  </script>

  
</body>
</html>
