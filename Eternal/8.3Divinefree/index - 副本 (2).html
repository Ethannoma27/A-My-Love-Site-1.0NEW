<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>共频 • 心灵成长</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

   body {
  height: 100vh;
  overflow: hidden;
  font-family: 'Cinzel', serif;
  color: #1a1a1a;
  background: #f8f5ec; /* 宣纸柔米色 */
  position: relative;
}

/* 水墨画背景（改为图片方式） */

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('images/washing.png') no-repeat center/cover;
  background-size: cover;
  mix-blend-mode: multiply;
  filter: brightness(0.95) contrast(1.05) blur(0.5px);
  opacity: 0.6;
  animation: inkFlow 60s ease-in-out infinite alternate;
  z-index: 0;
  pointer-events: none;
}

@keyframes inkFlow {
  0% {
    background-position: 45% 55%;
  }
  50% {
    background-position: 55% 45%;
  }
  100% {
    background-position: 45% 55%;
  }
}

    /* 青花瓷纹理柔光蒙版 */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('images/washing.png') repeat;
      mix-blend-mode: screen;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
      filter: blur(3px);
    }

        .ceramic-glow {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at 60% 40%, rgba(255,255,255,0.05), transparent 70%);
  filter: blur(80px);
  opacity: 0.4;
  pointer-events: none;
  z-index: 2;
}

.water-ripple {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100px;
  background: url('images/water-ripple.png') repeat-x;
  background-size: auto 100px;
  opacity: 0.3;
  animation: waveFlow 14s linear infinite;
  pointer-events: none;
  z-index: 2;
}


@keyframes waveFlow {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 0%; }
}


    /* 细腻粒子和发光层 */
    .particles, .glow-layer {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .particle {
      position: absolute;
      background: rgba(180, 210, 230, 0.15);
      border-radius: 50%;
      filter: drop-shadow(0 0 6px rgba(180, 210, 230, 0.5));
      animation: floatUp linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      to {
        transform: translateY(-120vh) scale(1.8);
        opacity: 0;
      }
    }

    .glow-layer {
      background: radial-gradient(circle at center, rgba(70, 130, 180, 0.25), transparent 70%);
      filter: blur(50px);
      animation: glowMove 35s ease-in-out infinite alternate;
      z-index: 2;
      opacity: 0.6;
    }
    @keyframes glowMove {
      0% {
        transform: translate(15vw, 20vh) scale(1);
      }
      100% {
        transform: translate(-15vw, -20vh) scale(1.4);
      }
    }

    /* 内容区 */
    .content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      user-select: none;
    }

    h1 {
      font-size: 4.5em;
      margin-bottom: 1rem;
      color: #dbe9f4;
      text-shadow:
        0 0 8px rgba(130, 180, 230, 0.9),
        0 0 18px rgba(130, 180, 230, 0.7);
      animation: float 6s ease-in-out infinite;
      font-family: 'Dancing Script', cursive;
      letter-spacing: 0.05em;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    p {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8em;
      line-height: 1.8;
      max-width: 80%;
      color: #c4d8f1;
      text-shadow:
        0 0 6px rgba(130, 180, 230, 0.7),
        0 0 12px rgba(130, 180, 230, 0.5);
      animation: fadeIn 14s ease-in-out infinite;
      margin-bottom: 2rem;
    }

    @keyframes fadeIn {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
    }

    /* 播放按钮 */
    #playButton {
      position: relative;
      background: #6195ED;
      color: #f0f8ff;
      font-family: 'Cinzel', serif;
      font-size: 1.25em;
      width: 180px;
      padding: 12px 0;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      box-shadow:
        0 0 10px #6195ED,
        0 0 30px #a2c3f9;
      animation: pulseGlow 3.5s ease-in-out infinite;
      transition: box-shadow 0.3s ease;
      z-index: 10;
      margin: 0 auto;
    }
    #playButton:hover {
      box-shadow:
        0 0 15px #94bfff,
        0 0 40px #d0e2ff;
      transform: scale(1.07);
    }
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow:
          0 0 10px #6195ED,
          0 0 30px #a2c3f9;
      }
      50% {
        box-shadow:
          0 0 18px #94bfff,
          0 0 45px #d0e2ff;
      }
    }

    /* 爱的导航按钮 */
    #loveNavigationButton {
      position: fixed;
      left: 65%;
      bottom: 140px;
      width: 160px;
      background: linear-gradient(135deg, #a0b8d9, #d4e0f7);
      color: #1a1a1a;
      font-family: 'Cinzel', serif;
      font-size: 1.1em;
      border-radius: 30px;
      border: none;
      padding: 12px 0;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(100, 120, 180, 0.3);
      transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.4s ease;
      z-index: 10;
    }
    #loveNavigationButton:hover {
      background: linear-gradient(135deg, #c0d0f5, #f0f6ff);
      transform: scale(1.05);
      box-shadow: 0 8px 18px rgba(100, 120, 180, 0.5);
    }

    /* 弹窗 */
    .mini-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.75);
      width: 520px;
      height: 460px;
      background: rgba(255 255 255 / 0.08);
      color: #c0d0f5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      font-family: 'Dancing Script', cursive;
      font-size: 1.4em;
      line-height: 1.4;
      text-shadow: 0 0 12px rgba(120, 150, 230, 0.8);
      box-shadow: 0 0 28px rgba(120, 150, 230, 0.5);
      backdrop-filter: blur(10px);
      z-index: 9999;
      animation: fadeInOpacity 0.5s ease forwards;
      clip-path: path('M250 90 C190 0, 40 0, 40 120 C40 210, 250 330, 250 330 C250 330, 460 210, 460 120 C460 0, 310 0, 250 90 Z');
    }
    .mini-popup-content {
      width: 60%;
      height: 60%;
      padding-top: 10%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      transform: translate(-3%, 10%);
    }
    .pink-text {
      color: #ff69b4;
    }
    @keyframes fadeInOpacity {
      from { opacity: 0; }
      to { opacity: 1; }
    }


  </style>
</head>
<body>


  <div class="water-ripple"></div>


  <div class="content">
    <h1>自由频 · 共成长</h1>
    <button id="playButton">播放青花瓷古筝</button>
    <p>
      自由 意识 唤醒 <br />
      主权 剧本 觉醒 <br />
    </p>
    <button id="loveNavigationButton">Back to free</button>
  </div>

  <!-- 音乐播放器控制 -->
  <audio id="myAudio" preload="auto" muted>
    <source src="MP3/Careabout.mp3" type="audio/mp3" />
    您的浏览器不支持音频播放。
  </audio>

  <script>
    // 爱的导航按钮点击事件
    document.getElementById('loveNavigationButton').addEventListener('click', function () {
      window.location.href = '/';
    });

    // 播放按钮点击事件
    document.getElementById('playButton').addEventListener('click', function () {
      const audio = document.getElementById('myAudio');
      if (audio.paused) {
        audio.muted = false;
        audio.play().catch((e) => console.log('播放失败:', e));
        this.textContent = '暂停音乐';
      } else {
        audio.pause();
        this.textContent = '播放青花瓷古筝';
        // 显示弹窗提示
        const popup = document.getElementById('miniPopup');
        popup.style.display = 'flex';
        setTimeout(() => {
          popup.style.display = 'none';
        }, 2500);
      }
    });

    // 生成细腻粒子
    const pWrap = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      p.style.width = p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 18 + 15) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      pWrap.appendChild(p);
    }
  </script>
</body>
</html>
