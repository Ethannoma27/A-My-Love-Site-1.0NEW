
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>共频成长 • 心灵自由</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height:100vh;
      overflow:hidden;
      font-family:'Cinzel', serif;
      color: #fff;
      background: linear-gradient(135deg, #2b5876, #4e4376, #e0c3fc);
      background-size: 300% 300%;
      animation: bgMove 20s ease infinite;
      position: relative;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .stars, .particles {
      position:absolute; top:0; left:0;
      width:100%; height:100%;
      pointer-events:none;
    }

    .stars .star {
      position:absolute;
      background:#fff;
      border-radius:50%;
      opacity:0;
      animation: starTwinkle 2s infinite ease-in-out;
    }
    @keyframes starTwinkle {
      0%,100% { opacity:0; }
      50% { opacity:0.8; }
    }

    .particles .p {
      position:absolute;
      width:4px; height:4px;
      background:rgba(255,255,255,0.2);
      border-radius:50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      to { transform: translateY(-120vh) scale(1.5); opacity:0; }
    }

    .glow {
      position:absolute;
      width:200px; height:200px;
      background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
      filter: blur(60px);
      animation: glowMove 25s ease-in-out infinite alternate;
    }
    @keyframes glowMove {
      0% { transform: translate(var(--dx), var(--dy)) scale(1); }
      100% { transform: translate(calc(var(--dx)*-1), calc(var(--dy)*-1)) scale(1.3); }
    }

    .content {
      position: relative;
      z-index:1;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:2rem;
    }

               h1 {
            font-size: 4em;
            margin-bottom: 1rem;
            color: #f8f8f8;
            text-shadow: 0px 0px 10px rgba(255,255,255,0.8), 0px 0px 20px rgba(255,255,255,0.6);
            animation: float 6s ease-in-out infinite; /* 浮动时间增加为 6s */
            font-family: 'Dancing Script', cursive; /* 使用浪漫的手写字体 */
        

        }

   p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6em;
            line-height: 1.8;
            margin-bottom: 1rem;
            max-width: 80%;
            color: #f8f8f8;
            text-shadow: 0px 0px 10px rgba(255,255,255,0.7), 0px 0px 20px rgba(255,255,255,0.5);
            animation: fadeIn 12s ease-in-out infinite; /* 渐显效果的停留时间增加到 12s */
          
        }


/* 通用灵性按钮样式 */
.button, #loveNavigationButton {
  background: linear-gradient(135deg, #98c1d9, #e0fbfc); /* 水蓝渐变象征自由意识 */
  color: #2c3e50;
  border: none;
  padding: 10px 0;
  font-size: 1.1em;
  font-family: 'Cinzel', serif;
  border-radius: 30px;
  cursor: pointer;

  width: 150px;
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
  position: fixed;
  left: 65%;
  display: block;
  z-index: 1000;
  transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.4s ease;
}

/* 按钮 hover 效果：轻盈放大+柔光提升 */
.button:hover, #loveNavigationButton:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
  background: linear-gradient(135deg, #b5e2e7, #ffffff);
}


#loveNavigationButton {
  bottom: 135px;
}


.dynamic-frequency-button {
  bottom: 200px;
}

.dynamic-frequency-button {
  background: linear-gradient(135deg, #98c1d9, #e0fbfc); /* 水蓝渐变象征自由意识 */
  color: #2c3e50;
  border: none;
  padding: 10px 0;
  font-size: 1.1em;
  font-family: 'Cinzel', serif;
  border-radius: 30px;
  cursor: pointer;
  width: 150px;
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
  position: fixed;
  left: 65%;
  display: block;
  z-index: 1000;
  transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.4s ease;
}


.dynamic-frequency-button:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
  background: linear-gradient(135deg, #b5e2e7, #ffffff);
}
/* 粉色文字特别样式 */
.pink-text {
  color: #ff69b4;
  font-style: italic;
  text-shadow: 0 0 6px #ff69b4;
}

/* 粉色文字特别样式 */
.pink-text {
  color: #ff69b4;
  font-style: italic;
  text-shadow: 0 0 8px #ff69b4;
}

/* miniPopup 初始状态，支持渐隐透明 */


#miniPopup {
  opacity: 0;
  transition: opacity 3s ease;
  display: none;
  will-change: opacity;
}


.mini-popup {
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translateX(-50%) scale(0.7);
  width: 520px;
  height: 460px;
  background: linear-gradient(135deg, rgba(255,182,193,0.9), rgba(255,105,180,0.7));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1rem;
  font-family: 'Dancing Script', cursive;
  font-size: 1.3em;
  line-height: 1.4;
  text-shadow: 0 0 12px rgba(255, 105, 180, 0.8);
  box-shadow:
    0 0 25px rgba(255, 105, 180, 0.6),
    inset 0 0 15px rgba(255, 182, 193, 0.4);
  backdrop-filter: blur(10px);
  z-index: 9999;

  clip-path: path('M250 90 C190 0, 40 0, 40 120 C40 210, 250 330, 250 330 C250 330, 460 210, 460 120 C460 0, 310 0, 250 90 Z');

  /* 仅使用透明度渐变，不要动画冲突 */
  opacity: 0;
  transition: opacity 3s ease;
  will-change: opacity;

  animation: none;  /* 禁用之前可能的动画 */
}

.mini-popup-content {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding-top: 20%;  /* 心形整体下移 */
  transform: translate(-3%, -20%);  /* 文字上移10% */
}

@keyframes fadeInOpacity {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* 点击按钮缩放动画 */
  .click-effect {
    animation: clickScale 0.3s ease forwards;
  }
  @keyframes clickScale {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }



  /* 星星样式 */
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 0.2; }
  }

  /* 粒子样式 */
  .p {
    position: absolute;
    background: rgba(255, 192, 203, 0.7);
    border-radius: 50%;
    opacity: 0.6;
    animation-name: floatUp;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 0.6; }
    100% { transform: translateY(-100vh); opacity: 0; }
  }

  @media screen and (max-width: 480px) {
  body {
    font-family: 'Dancing Script', cursive, sans-serif;
    padding: 1rem;
    font-size: 16px;
    background-size: cover;
  }

  .content {
    padding: 1rem;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  h1 {
    display: none;
  }

  p {
    font-family: 'Dancing Script', cursive, sans-serif;
    font-size: 1.2rem;
    line-height: 1.6;
    max-width: 90vw;
    padding: 0 0.5rem;
    white-space: normal;
    color: #f8f8f8;
    text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
  }
}

  </style>
</head>


<body>

  <div class="stars" id="stars"></div>
  <div class="particles" id="particles"></div>
  <div class="glow" style="--dx:15vw;--dy:20vh;"></div>
  <div class="glow" style="--dx:-20vw;--dy:-15vh;"></div>

  <div class="content">
    <div>

    <h1> 对不起 · 久等了</h1> 



    <p class="move-down"> 
    对不起 让你久等了  <br> 


    看着2022.9.2 我写的签名 <br>  


    每次和你重逢 那么开心 <br>  

    昨天我想 爱你 就像宿命的牵引 <br>  

    没有预设 因为爱像锚定感的安心 <br>  

    爱是 因为内心所向 与 自由<br>   

    爱不是提供爱的证明和情绪价值 <br>   

    更让彼此更加轻松 更加自由 <br>   

    不强求 我们未来的选择 <br>   

    我爱你不是限制 也不是控制 因为爱就是爱本身<br>  



</p>


<!-- Soul mate 按钮 -->
<button id="playButton" class="dynamic-frequency-button">Divine Free</button>

<!-- 音乐播放器控制 -->
<div class="music-player">
  <audio id="myAudio" preload="auto" muted>
    <source src="MP3/Likeu.mp3" type="audio/mp3">
    您的浏览器不支持音频播放。
  </audio>
</div> 

<!-- 爱的导航按钮 -->
<button id="loveNavigationButton">Back to free</button> 

<!-- 弹窗 -->
<div id="miniPopup" class="mini-popup" style="display:none;">
  <div class="mini-popup-content">
    <p>爱 就像无尽的探索 <br> 联结着 好奇 和 自由 <br> 
      <span class="pink-text">Baby</span> 💕  
    </p>
  </div>
</div>

<!-- 星星容器 -->
<div id="stars" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:500;"></div>

<!-- 粒子容器 -->
<div id="particles" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:500;"></div>




<script>

const playButton = document.getElementById('playButton');
const loveButton = document.getElementById('loveNavigationButton');
const audio = document.getElementById('myAudio');
const miniPopup = document.getElementById('miniPopup');
const starsContainer = document.getElementById('stars');
const particlesContainer = document.getElementById('particles');

let hidePopupTimeout1 = null;
let hidePopupTimeout2 = null;

// 生成星星和粒子动画
function generateStars() {
  starsContainer.innerHTML = '';
  for(let i=0; i<100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.width = star.style.height = size + 'px';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDelay = (Math.random() * 2) + 's';
    starsContainer.appendChild(star);
  }
}

function generateParticles() {
  particlesContainer.innerHTML = '';
  for(let i=0; i<30; i++) {
    const p = document.createElement('div');
    p.className = 'p';
    const size = Math.random() * 10 + 5;
    p.style.width = p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 15 + 10) + 's';
    particlesContainer.appendChild(p);
  }
} 

// playButton 点击播放音频，只控制音乐，按钮保持不变，不渐隐
playButton.addEventListener('click', () => {
  audio.muted = false;
  audio.play().catch(err => {
    console.log("播放失败，原因:", err);
  });

  // 清除弹窗渐隐定时器，避免冲突
  if (hidePopupTimeout1) clearTimeout(hidePopupTimeout1);
  if (hidePopupTimeout2) clearTimeout(hidePopupTimeout2);

  // 弹窗立即渐隐并隐藏（和之前一样）
  miniPopup.style.opacity = '0';
  setTimeout(() => {
    miniPopup.style.display = 'none';
  }, 1500);

  playButton.classList.add('click-effect');
});

playButton.addEventListener('animationend', () => {
  playButton.classList.remove('click-effect');
});

window.addEventListener('load', () => {
  generateStars();
  generateParticles();
}); 


// 弹窗透明度渐变结束监听
miniPopup.addEventListener('transitionend', (e) => {
  if (e.propertyName === 'opacity' && miniPopup.style.opacity === '0') {
    miniPopup.style.display = 'none';
    console.log('弹窗已隐藏');
  }
});

// loveButton 点击显示弹窗，5秒后开始渐隐消失（只用一个定时器）
loveButton.addEventListener('click', () => {
  // 清除之前定时器
  if (hidePopupTimeout1) clearTimeout(hidePopupTimeout1);

  // 先显示弹窗，并从透明开始
  miniPopup.style.display = 'block';
  miniPopup.style.opacity = '0';  // 确保从透明开始
  void miniPopup.offsetWidth;     // 强制重绘，确保过渡生效
  miniPopup.style.opacity = '1';  // 变为不透明，触发过渡

  loveButton.classList.add('click-effect');

  // 5秒后开始渐隐，渐隐时间3秒由CSS控制
  hidePopupTimeout1 = setTimeout(() => {
    miniPopup.style.opacity = '0';
  }, 5000);
});

loveButton.addEventListener('animationend', () => {
  loveButton.classList.remove('click-effect');
});


</script>

</body>



</html>
